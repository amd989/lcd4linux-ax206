name: Build & Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - arch: amd64
            docker_platform: linux/amd64
          - arch: arm64
            docker_platform: linux/arm64
          - arch: armhf
            docker_platform: linux/arm/v7

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Extract version from tag
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Build .deb package
        run: |
          docker run --rm --platform ${{ matrix.docker_platform }} \
            -v "$PWD":/build -w /build \
            debian:bookworm bash -c '
              set -e
              apt-get update
              apt-get install -y --no-install-recommends \
                build-essential debhelper autoconf automake libtool libtool-bin pkg-config \
                libusb-1.0-0-dev libgd-dev libvncserver-dev \
                libx11-dev libxext-dev libxpm-dev \
                libmosquitto-dev \
                git
              # Update changelog version from tag
              sed -i "1s/([^)]*)/('"${{ steps.version.outputs.version }}"'-1)/" debian/changelog
              dpkg-buildpackage -us -uc -b
              mkdir -p output
              mv ../*.deb output/
            '

      - name: Upload .deb artifact
        uses: actions/upload-artifact@v4
        with:
          name: deb-${{ matrix.arch }}
          path: output/*.deb

  build-rpm:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - arch: x86_64
            docker_platform: linux/amd64
          - arch: aarch64
            docker_platform: linux/arm64

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Extract version from tag
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Build .rpm package
        run: |
          docker run --rm --platform ${{ matrix.docker_platform }} \
            -v "$PWD":/build -w /build \
            rockylinux:9 bash -c '
              set -e
              dnf install -y epel-release
              dnf config-manager --set-enabled crb
              dnf install -y gcc make autoconf automake libtool pkgconfig \
                libusbx-devel gd-devel libvncserver-devel \
                libX11-devel libXext-devel libXpm-devel \
                mosquitto-devel \
                rpm-build git systemd-rpm-macros gettext-devel
              VERSION='"${{ steps.version.outputs.version }}"'
              # RPM Version field forbids "-"; replace with "." (sorts lower, correct for pre-releases)
              RPM_VERSION=$(echo "$VERSION" | tr - .)
              # Create source tarball
              mkdir -p /root/rpmbuild/{SOURCES,SPECS}
              tar czf /root/rpmbuild/SOURCES/lcd4linux-ax206-${RPM_VERSION}.tar.gz \
                --transform "s,^\.,lcd4linux-ax206-${RPM_VERSION}," \
                --exclude=.git .
              cp rpm/lcd4linux-ax206.spec /root/rpmbuild/SPECS/
              rpmbuild -bb --define "_version ${RPM_VERSION}" /root/rpmbuild/SPECS/lcd4linux-ax206.spec
              mkdir -p /build/output
              cp /root/rpmbuild/RPMS/*/*.rpm /build/output/
            '

      - name: Upload .rpm artifact
        uses: actions/upload-artifact@v4
        with:
          name: rpm-${{ matrix.arch }}
          path: output/*.rpm

  build-themeeditor:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            rid: win-x64
            archive_ext: zip
          - os: ubuntu-latest
            rid: linux-x64
            archive_ext: tar.gz
          - os: ubuntu-latest
            rid: linux-arm64
            archive_ext: tar.gz
          - os: macos-14
            rid: osx-x64
            archive_ext: tar.gz
          - os: macos-latest
            rid: osx-arm64
            archive_ext: tar.gz
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extract version from tag
        id: version
        shell: bash
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore ThemeEditor/ThemeEditor.csproj -r ${{ matrix.rid }}

      - name: Publish self-contained single-file
        shell: bash
        run: |
          dotnet publish ThemeEditor/ThemeEditor.csproj \
            -c Release \
            -r ${{ matrix.rid }} \
            --self-contained true \
            --no-restore \
            -p:PublishSingleFile=true \
            -p:IncludeNativeLibrariesForSelfExtract=true \
            -p:DebugType=None \
            -p:DebugSymbols=false \
            -p:Version=${{ steps.version.outputs.version }} \
            -o publish

      - name: Package (zip)
        if: matrix.archive_ext == 'zip'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path output | Out-Null
          $name = "ThemeEditor-${{ steps.version.outputs.version }}-${{ matrix.rid }}.zip"
          Compress-Archive -Path publish/* -DestinationPath "output/$name"

      - name: Package (tar.gz)
        if: matrix.archive_ext == 'tar.gz'
        shell: bash
        run: |
          mkdir -p output
          name="ThemeEditor-${{ steps.version.outputs.version }}-${{ matrix.rid }}.tar.gz"
          tar -czf "output/$name" -C publish .

      - name: Upload ThemeEditor artifact
        uses: actions/upload-artifact@v4
        with:
          name: themeeditor-${{ matrix.rid }}
          path: output/*

  build-freebsd:
    runs-on: [self-hosted, freebsd]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extract version from tag
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Build lcd4linux
        run: |
          ./bootstrap
          ./configure --with-drivers=DPF,VNC,X11
          make clean
          make
          ./lcd4linux -l

      - name: Build FreeBSD .pkg
        run: |
          chmod +x pkg/freebsd/build-pkg.sh
          sh pkg/freebsd/build-pkg.sh "${{ steps.version.outputs.version }}"

      - name: Upload pkg
        uses: actions/upload-artifact@v4
        with:
          name: pkg-freebsd-amd64
          path: dist/*.pkg

      - name: Clean up
        if: always()
        run: |
          make distclean 2>/dev/null || true
          rm -rf dist repo

  release:
    needs: [build, build-rpm, build-freebsd, build-themeeditor]
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: packages
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            packages/*.deb
            packages/*.rpm
            packages/*.pkg
            packages/ThemeEditor-*.zip
            packages/ThemeEditor-*.tar.gz
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}

  # Packages are published centrally by amd989/packages, which serves
  # packages.alejandro.md. This repository builds, attaches the artifacts to
  # its own GitHub Release, and asks the publisher to pick that release up.
  # The signing key and the storage credentials live only over there.
  publish:
    needs: [release]
    if: ${{ !contains(github.ref_name, '-') }}
    runs-on: ubuntu-latest
    steps:
      - name: Publish to packages.alejandro.md
        env:
          GH_TOKEN: ${{ secrets.PACKAGES_DISPATCH_TOKEN }}
          REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if [ -z "$GH_TOKEN" ]; then
            echo "::error::PACKAGES_DISPATCH_TOKEN is not set. The release exists, but packages.alejandro.md was not asked to publish it. Set the secret, then run the publish workflow in amd989/packages by hand for $REPO $TAG."
            exit 1
          fi
          # -f rather than -F: -F converts values that look like numbers or
          # booleans, and the publisher expects the tag as a string.
          gh api repos/amd989/packages/dispatches \
            -f event_type=publish \
            -f "client_payload[repo]=$REPO" \
            -f "client_payload[tag]=$TAG"
          {
            echo "### Asked packages.alejandro.md to publish \`$REPO\` \`$TAG\`"
            echo
            echo "Follow it at https://github.com/amd989/packages/actions/workflows/publish.yaml"
          } >> "$GITHUB_STEP_SUMMARY"
